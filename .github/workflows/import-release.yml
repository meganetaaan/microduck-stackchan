name: Import reviewed release sources
on:
  push:
    branches: [main]
    paths: ['release-part-*.zip', 'release-import-manifest.json', '.github/workflows/import-release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initial-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify and extract the reviewed release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile, stat
          root=Path.cwd()
          manifest=json.loads(Path('release-import-manifest.json').read_text())
          for item in manifest['parts']:
              name=item['name']
              assert name.startswith('release-part-') and name.endswith('.zip') and '/' not in name
              part=Path(name)
              assert part.stat().st_size==item['bytes']
              assert hashlib.sha256(part.read_bytes()).hexdigest()==item['sha256'],name
              with zipfile.ZipFile(part) as archive:
                  assert archive.testzip() is None
                  for info in archive.infolist():
                      rel=PurePosixPath(info.filename)
                      assert not rel.is_absolute() and '..' not in rel.parts
                      assert not any(x in {'.git','.github','.openai','node_modules','.venv'} for x in rel.parts)
                      assert not stat.S_ISLNK(info.external_attr>>16)
                  archive.extractall(root)
          PY
          python3 scripts/verify_release.py
      - name: Commit expanded source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- release-part-*.zip release-import-manifest.json
          git add --all
          git commit -m 'Import reviewed models, thin-flap designs, gait training and web simulator'
          git push origin HEAD:main
