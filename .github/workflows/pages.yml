name: Web simulator CI and Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/verify_release.py', 'prototype/**', 'training/**', 'design/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', 'scripts/verify_release.py', 'prototype/**', 'training/**', 'design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - name: Verify preserved model and policy assets
        working-directory: .
        run: python3 scripts/verify_release.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Unit, UI-input, subpath, Worker, parity and long gait tests
        run: npm run test:all
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test real Chromium at the GitHub project subpath
        shell: bash
        run: |
          npm run serve:pages > test-results/preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/microduck-stackchan/ > /dev/null && break
            sleep 1
          done
          npm run test:browser -- http://127.0.0.1:8000/microduck-stackchan/
          node scripts/update-validation-report.mjs
          npm run build
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-verification
          path: web/test-results/
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested simulator
        id: deployment
        uses: actions/deploy-pages@v4
